<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      .scan{animation:scanline 3s linear infinite}
      @keyframes scanline{0%{transform:translateY(-340px);opacity:.04}100%{transform:translateY(340px);opacity:.04}}
      .blink{animation:blink 1.1s step-end infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .glitch-1{animation:glitch1 6s infinite}
      .glitch-2{animation:glitch2 6s infinite}
      @keyframes glitch1{0%,89%,100%{transform:translate(0,0);opacity:0}90%{transform:translate(-4px,2px);opacity:.7}93%{transform:translate(3px,-1px);opacity:.5}96%{transform:translate(0,0);opacity:0}}
      @keyframes glitch2{0%,91%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(5px,-3px);opacity:.6}95%{transform:translate(-2px,2px);opacity:.4}98%{transform:translate(0,0);opacity:0}}
      .ticker{animation:ticker 18s linear infinite}
      @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
      .pulse-border{animation:pulseb 2.4s ease-in-out infinite}
      @keyframes pulseb{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
      .fade-in-row{animation:faderow .6s ease forwards;opacity:0}
      .r1{animation-delay:.1s}.r2{animation-delay:.35s}.r3{animation-delay:.6s}.r4{animation-delay:.85s}
      @keyframes faderow{to{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="340" fill="#0a0a0a"/>
  <rect x="0" y="0" width="18" height="340" fill="#E8404A"/>
  <rect x="18" y="0" width="1182" height="44" fill="#111111"/>
  <rect x="18" y="44" width="1182" height="2" fill="#E8404A"/>

  <text x="36" y="29" font-family="'Share Tech Mono', monospace" font-size="13" fill="#E8404A" letter-spacing="3">PITAHAYA.DEV</text>
  <text x="200" y="29" font-family="'Share Tech Mono', monospace" font-size="13" fill="#444" letter-spacing="2">// github.com/julesklord</text>

  <rect x="1040" y="12" width="140" height="22" fill="none" stroke="#E8404A" stroke-width="1" class="pulse-border"/>
  <circle cx="1056" cy="23" r="4" fill="#34a853"/>
  <text x="1067" y="27" font-family="'Share Tech Mono', monospace" font-size="11" fill="#34a853" letter-spacing="1">STATUS: ACTIVE</text>

  <g class="fade-in-row r1">
    <rect x="36" y="62" width="130" height="130" fill="#E8404A"/>
    <text x="52" y="172" font-family="Arial Black, sans-serif" font-size="130" font-weight="900" fill="#0a0a0a" letter-spacing="-6">J</text>
  </g>

  <g class="fade-in-row r2">
    <text x="176" y="142" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-4">ULES</text>
    <text x="176" y="142" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#E8404A" letter-spacing="-4" class="glitch-1">ULES</text>
    <text x="176" y="142" font-family="Arial Black, sans-serif" font-size="96" font-weight="900" fill="#00ffff" letter-spacing="-4" class="glitch-2">ULES</text>
  </g>

  <g class="fade-in-row r3">
    <text x="176" y="192" font-family="Arial Black, sans-serif" font-size="46" font-weight="900" fill="#E8404A" letter-spacing="8">MARTINS</text>
  </g>

  <rect x="590" y="62" width="2" height="180" fill="#222"/>

  <g class="fade-in-row r1">
    <text x="614" y="90" font-family="'Share Tech Mono', monospace" font-size="11" fill="#555" letter-spacing="3">ROLE</text>
    <text x="614" y="110" font-family="'Share Tech Mono', monospace" font-size="14" fill="#fff" letter-spacing="1">MUSIC PRODUCER · AUDIO ENG</text>
  </g>
  <g class="fade-in-row r2">
    <text x="614" y="138" font-family="'Share Tech Mono', monospace" font-size="11" fill="#555" letter-spacing="3">EXP</text>
    <text x="614" y="158" font-family="'Share Tech Mono', monospace" font-size="14" fill="#E8404A" letter-spacing="1">17 YEARS</text>
  </g>
  <g class="fade-in-row r3">
    <text x="614" y="186" font-family="'Share Tech Mono', monospace" font-size="11" fill="#555" letter-spacing="3">STACK</text>
    <text x="614" y="206" font-family="'Share Tech Mono', monospace" font-size="14" fill="#fff" letter-spacing="1">RUST · PY · TS · POWERSHELL</text>
  </g>
  <g class="fade-in-row r4">
    <text x="614" y="234" font-family="'Share Tech Mono', monospace" font-size="11" fill="#555" letter-spacing="3">LOCATION</text>
    <text x="614" y="254" font-family="'Share Tech Mono', monospace" font-size="14" fill="#fff" letter-spacing="1">LA PAZ · BCS · MEXICO</text>
  </g>

  <g fill="none" stroke="#333" stroke-width="1">
    <line x1="955" y1="75" x2="975" y2="75"/><line x1="965" y1="65" x2="965" y2="85"/>
    <line x1="995" y1="95" x2="1015" y2="95"/><line x1="1005" y1="85" x2="1005" y2="105"/>
    <line x1="940" y1="130" x2="960" y2="130"/><line x1="950" y1="120" x2="950" y2="140"/>
    <line x1="1030" y1="60" x2="1050" y2="60"/><line x1="1040" y1="50" x2="1040" y2="70"/>
    <line x1="1080" y1="115" x2="1100" y2="115"/><line x1="1090" y1="105" x2="1090" y2="125"/>
    <line x1="1120" y1="75" x2="1140" y2="75"/><line x1="1130" y1="65" x2="1130" y2="85"/>
    <line x1="970" y1="170" x2="990" y2="170"/><line x1="980" y1="160" x2="980" y2="180"/>
    <line x1="1060" y1="200" x2="1080" y2="200"/><line x1="1070" y1="190" x2="1070" y2="210"/>
    <line x1="1140" y1="160" x2="1160" y2="160"/><line x1="1150" y1="150" x2="1150" y2="170"/>
  </g>

  <rect x="18" y="296" width="1182" height="2" fill="#222"/>
  <rect x="18" y="298" width="1182" height="42" fill="#0d0d0d"/>

  <clipPath id="tickclip">
    <rect x="36" y="300" width="1150" height="36"/>
  </clipPath>
  <g clip-path="url(#tickclip)">
    <text class="ticker" y="323" font-family="'Share Tech Mono', monospace" font-size="12" fill="#333" letter-spacing="2">
      RUST · PYTHON · TYPESCRIPT · ELECTRON · TAURI · RATATUI · REAPER · WAVES ULTIMATE · NEOVIM · ARCH WSL2 · DOCKER · GIT · KISS-FIRST · TERMINAL-NATIVE · SHIP WHEN IT WORKS · RUST · PYTHON · TYPESCRIPT · ELECTRON · TAURI · RATATUI · REAPER · WAVES ULTIMATE · NEOVIM · ARCH WSL2 · DOCKER · GIT · KISS-FIRST · TERMINAL-NATIVE · SHIP WHEN IT WORKS ·
    </text>
  </g>

  <rect width="1200" height="60" fill="#fff" opacity="0.015" class="scan"/>
  <rect x="574" y="148" width="10" height="46" fill="#E8404A" class="blink"/>
</svg>
